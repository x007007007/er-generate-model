[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x007007007-er-gen-tool-ai"
version = "0.3.0"
description = "AI Extension for ER Diagram Generator Tool"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "x007007007"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "x007007007-er-gen-core>=0.3.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-deepseek>=0.1.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
]

[project.entry-points."er_gen_tool.plugins"]
ai-assist = "x007007007.er_tool_ai.cli_plugin:ai_assist_cmd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
x007007007-er-gen-core = { git = "ssh://git@github.com/x007007007/er-gen-core.git" }
