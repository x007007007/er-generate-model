[config]
namespace = "test.basic"

[entities.USER]
table_name = "test_user"

[[entities.USER.columns]]
name = "id"
type = "int"
primary_key = true

[[entities.USER.columns]]
name = "username"
type = "string"

[entities.POST]
table_name = "test_post"

[[entities.POST.columns]]
name = "id"
type = "int"
primary_key = true

[[relationships]]
left = "USER"
right = "POST"
type = "one-to-many"
