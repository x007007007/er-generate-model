[config]
namespace = "test.multiple_entities_different_inheritance"

[templates.create_update_time]

[[templates.create_update_time.columns]]
name = "created_at"
type = "datetime"

[templates.enable]

[[templates.enable.columns]]
name = "is_enabled"
type = "boolean"

[entities.USER]
table_name = "test_user"
extends = ["create_update_time", "enable"]

[[entities.USER.columns]]
name = "username"
type = "string"

[entities.POST]
table_name = "test_post"
extends = ["create_update_time"]

[[entities.POST.columns]]
name = "title"
type = "string"

[entities.TAG]
table_name = "test_tag"

[[entities.TAG.columns]]
name = "name"
type = "string"
