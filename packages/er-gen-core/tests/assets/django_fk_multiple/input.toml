[config]
namespace = "test.django_fk_multiple"

[[relationships]]
left = "I18nCode"
right = "Translation"
type = "one-to-many"
left_column = "id"
right_column = "code_id"

[[relationships]]
left = "I18nBlock"
right = "Translation"
type = "one-to-many"
left_column = "id"
right_column = "block_id"

[entities.I18nCode]
table_name = "i18n_code"

[[entities.I18nCode.columns]]
name = "id"
type = "bigint"
primary_key = true
nullable = false

[[entities.I18nCode.columns]]
name = "name"
type = "string"
max_length = 255

[entities.I18nBlock]
table_name = "i18n_block"

[[entities.I18nBlock.columns]]
name = "id"
type = "bigint"
primary_key = true
nullable = false

[[entities.I18nBlock.columns]]
name = "code"
type = "string"
max_length = 255

[entities.Translation]
table_name = "translation"

[[entities.Translation.columns]]
name = "id"
type = "bigint"
primary_key = true
nullable = false

[[entities.Translation.columns]]
name = "code"
db_column = "code_id"
type = "bigint"

[[entities.Translation.columns]]
name = "block"
db_column = "block_id"
type = "bigint"

[[entities.Translation.columns]]
name = "text"
type = "text"
