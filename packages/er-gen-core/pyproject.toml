[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x007007007-er-gen-core"
version = "0.3.0"
description = "ER Diagram Core Library"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "x007007007"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jinja2>=3.1.2",
    "antlr4-python3-runtime>=4.13.1",
    "sqlalchemy>=2.0.0",
    "toml>=0.10.2",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/x007007007/er-gen-core"
Repository = "https://github.com/x007007007/er-gen-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"x007007007.er.renderers.python.django" = ["templates/*.j2"]
"x007007007.er.renderers.python.sqlalchemy" = ["templates/*.j2"]
