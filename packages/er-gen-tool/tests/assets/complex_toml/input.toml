[config]
namespace = "test.complex"

[templates.create_update_time]

[[templates.create_update_time.columns]]
name = "created_at"
type = "datetime"
comment = "Creation timestamp"

[[templates.create_update_time.columns]]
name = "updated_at"
type = "datetime"
comment = "Update timestamp"

[templates.enable]

[[templates.enable.columns]]
name = "is_enabled"
type = "boolean"
comment = "Whether the record is enabled"

[templates.name]

[[templates.name.columns]]
name = "name"
type = "string"
comment = "Name field"

[templates.audit_fields]

[[templates.audit_fields.columns]]
name = "id"
type = "int"
primary_key = true
comment = "Primary key"

[entities.USER]
table_name = "test_user"
extends = ["audit_fields", "create_update_time", "enable"]
comment = "User entity represents system users"

[[entities.USER.columns]]
name = "username"
type = "string"
unique = true
comment = "Unique username"

[[entities.USER.columns]]
name = "password"
type = "string"
comment = "Encrypted password"

[[entities.USER.columns]]
name = "email"
type = "string"
comment = "User email address"

[[entities.USER.columns]]
name = "last_login"
type = "datetime"
nullable = true
comment = "Last login timestamp"

[entities.PROFILE]
table_name = "test_profile"
extends = ["audit_fields", "create_update_time"]
comment = "User profile information"

[[entities.PROFILE.columns]]
name = "user_id"
type = "int"
comment = "Foreign key to USER"

[[entities.PROFILE.columns]]
name = "bio"
type = "string"
nullable = true
comment = "User biography"

[[entities.PROFILE.columns]]
name = "avatar_url"
type = "string"
nullable = true
comment = "Avatar image URL"

[entities.POST]
table_name = "test_post"
extends = ["audit_fields", "create_update_time", "enable"]
comment = "Blog post entity"

[[entities.POST.columns]]
name = "author_id"
type = "int"
comment = "Foreign key to USER (author)"

[[entities.POST.columns]]
name = "title"
type = "string"
comment = "Post title"

[[entities.POST.columns]]
name = "content"
type = "text"
comment = "Post content"

[[entities.POST.columns]]
name = "status"
type = "string"
comment = "enum:draft,published,archived - Post status"

[entities.TAG]
table_name = "test_tag"
extends = ["audit_fields", "create_update_time", "name"]
comment = "Tag entity for categorizing posts"

[entities.POST_TAGS]
table_name = "test_post_tags"
comment = "Junction table for many-to-many relationship"

[[entities.POST_TAGS.columns]]
name = "post_id"
type = "int"
comment = "Foreign key to POST"

[[entities.POST_TAGS.columns]]
name = "tag_id"
type = "int"
comment = "Foreign key to TAG"

[[relationships]]
left = "USER"
right = "PROFILE"
type = "one-to-one"

[[relationships]]
left = "USER"
right = "POST"
type = "one-to-many"

[[relationships]]
left = "POST"
right = "TAG"
type = "many-to-many"
