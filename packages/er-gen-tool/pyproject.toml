[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x007007007-er-gen-tool"
version = "0.3.0"
description = "ER Diagram Generator CLI Tool"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "x007007007"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "x007007007-er-gen-core>=0.3.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
ai = [
    "x007007007-er-gen-tool-ai>=0.3.0",
]

[project.scripts]
er-gen-tool = "x007007007.er_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
x007007007-er-gen-core = { workspace = true }
x007007007-er-gen-tool-ai = { workspace = true }
