# Root workspace configuration
# This file is for development purposes only
# Individual packages have their own pyproject.toml files

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
addopts = "--cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = [
    "packages/er-gen-core/src",
    "packages/er-gen-tool/src",
    "packages/er-gen-mcp/src",
    "packages/er-gen-tool-ai/src",
    "packages/er-django/src",
]
omit = [
    "*/generated/*",
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
]
