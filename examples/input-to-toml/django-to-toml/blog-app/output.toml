[config]
namespace = "blog"

[entities.Category]
comment = "文章分类"
table_name = "category"

[[entities.Category.columns]]
name = "id"
type = "int"
primary_key = true
comment = "Auto-generated primary key"

[[entities.Category.columns]]
name = "name"
type = "string"
max_length = 100
unique = true
comment = "分类名称"

[[entities.Category.columns]]
name = "slug"
type = "string"
max_length = 100
unique = true
comment = "URL别名"

[[entities.Category.columns]]
name = "description"
type = "text"
nullable = true
comment = "分类描述"

[[entities.Category.columns]]
name = "created_at"
type = "datetime"
comment = "创建时间"

[entities.Post]
comment = "博客文章"
table_name = "post"

[[entities.Post.columns]]
name = "id"
type = "int"
primary_key = true
comment = "Auto-generated primary key"

[[entities.Post.columns]]
name = "title"
type = "string"
max_length = 200
comment = "文章标题"

[[entities.Post.columns]]
name = "slug"
type = "string"
max_length = 200
unique = true
comment = "URL别名"

[[entities.Post.columns]]
name = "content"
type = "text"
comment = "文章内容"

[[entities.Post.columns]]
name = "excerpt"
type = "string"
max_length = 500
nullable = true
comment = "文章摘要"

[[entities.Post.columns]]
name = "author_id"
type = "int"
comment = "作者"

[[entities.Post.columns]]
name = "category_id"
type = "int"
nullable = true
comment = "分类"

[[entities.Post.columns]]
name = "status"
type = "string"
max_length = 20
default = "draft"
comment = "文章状态"

[[entities.Post.columns]]
name = "view_count"
type = "int"
default = 0
comment = "浏览次数"

[[entities.Post.columns]]
name = "created_at"
type = "datetime"
comment = "创建时间"

[[entities.Post.columns]]
name = "updated_at"
type = "datetime"
comment = "更新时间"

[[entities.Post.columns]]
name = "published_at"
type = "datetime"
nullable = true
comment = "发布时间"

[entities.Comment]
comment = "文章评论"
table_name = "comment"

[[entities.Comment.columns]]
name = "id"
type = "int"
primary_key = true
comment = "Auto-generated primary key"

[[entities.Comment.columns]]
name = "post_id"
type = "int"
comment = "所属文章"

[[entities.Comment.columns]]
name = "author_id"
type = "int"
comment = "评论者"

[[entities.Comment.columns]]
name = "content"
type = "text"
comment = "评论内容"

[[entities.Comment.columns]]
name = "is_approved"
type = "boolean"
default = true
comment = "是否已审核"

[[entities.Comment.columns]]
name = "created_at"
type = "datetime"
comment = "创建时间"

[[relationships]]
left = "User"
right = "Post"
type = "one-to-many"
right_column = "author_id"

[[relationships]]
left = "Category"
right = "Post"
type = "one-to-many"
right_column = "category_id"

[[relationships]]
left = "Post"
right = "Comment"
type = "one-to-many"
right_column = "post_id"

[[relationships]]
left = "User"
right = "Comment"
type = "one-to-many"
right_column = "author_id"
