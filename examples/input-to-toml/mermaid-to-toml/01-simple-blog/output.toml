# Simple Blog Model - Converted from Mermaid ER Diagram
# This example demonstrates converting a Mermaid ER diagram to TOML format
# Original: input.mmd

[entities.User]
comment = "User entity"
columns = [
    {name = "id", type = "uuid", is_pk = true, comment = "主键-唯一标识符"},
    {name = "username", type = "string", unique = true, comment = "用户名-唯一"},
    {name = "email", type = "string", unique = true, comment = "邮箱-唯一"},
    {name = "age", type = "int", comment = "年龄"},
    {name = "is_active", type = "boolean", comment = "是否激活"},
    {name = "created_at", type = "datetime", comment = "创建时间"},
]

[entities.Post]
comment = "Post entity"
columns = [
    {name = "id", type = "uuid", is_pk = true, comment = "主键-唯一标识符"},
    {name = "author_id", type = "uuid", is_fk = true, comment = "作者ID-外键"},
    {name = "title", type = "string", comment = "标题"},
    {name = "content", type = "text", comment = "内容"},
    {name = "created_at", type = "datetime", comment = "创建时间"},
]

[[relationships]]
left_entity = "User"
right_entity = "Post"
relation_type = "one-to-many"
right_label = "writes"
