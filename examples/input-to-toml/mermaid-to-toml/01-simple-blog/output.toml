[config]
namespace = "examples.simple_blog"

[entities.User]
comment = "User entity"
table_name = "user"

[[entities.User.columns]]
name = "id"
type = "uuid"
primary_key = true
comment = "主键-唯一标识符"

[[entities.User.columns]]
name = "username"
type = "string"
unique = true
comment = "用户名-唯一"

[[entities.User.columns]]
name = "email"
type = "string"
unique = true
comment = "邮箱-唯一"

[[entities.User.columns]]
name = "age"
type = "int"
comment = "年龄"

[[entities.User.columns]]
name = "is_active"
type = "boolean"
comment = "是否激活"

[[entities.User.columns]]
name = "created_at"
type = "datetime"
comment = "创建时间"

[entities.Post]
comment = "Post entity"
table_name = "post"

[[entities.Post.columns]]
name = "id"
type = "uuid"
primary_key = true
comment = "主键-唯一标识符"

[[entities.Post.columns]]
name = "author_id"
type = "uuid"
comment = "作者ID-外键"

[[entities.Post.columns]]
name = "title"
type = "string"
comment = "标题"

[[entities.Post.columns]]
name = "content"
type = "text"
comment = "内容"

[[entities.Post.columns]]
name = "created_at"
type = "datetime"
comment = "创建时间"

[[relationships]]
left = "User"
right = "Post"
type = "one-to-many"
