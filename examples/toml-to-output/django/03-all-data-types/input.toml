[config]
namespace = "examples.all_data_types"

[entities.DATA_TYPE_SHOWCASE]
comment = "Comprehensive showcase of all supported data types"
table_name = "data_type_showcase"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "id"
type = "uuid"
primary_key = true
comment = "主键-UUID类型"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "name"
type = "string"
comment = "字符串-可变长度"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "description"
type = "varchar"
comment = "可变字符-同string"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "code"
type = "char"
comment = "固定长度字符"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "content"
type = "text"
comment = "大文本内容"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "count"
type = "int"
comment = "整数-32位"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "quantity"
type = "integer"
comment = "整数-同int"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "big_number"
type = "bigint"
comment = "大整数-64位"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "small_number"
type = "smallint"
comment = "小整数-16位"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "tiny_number"
type = "tinyint"
comment = "微整数-8位"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "rating"
type = "float"
comment = "浮点数-单精度"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "weight"
type = "real"
comment = "浮点数-同float"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "score"
type = "double"
comment = "浮点数-双精度"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "price"
type = "decimal"
comment = "精确小数-货币"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "amount"
type = "numeric"
comment = "精确小数-同decimal"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "is_active"
type = "boolean"
comment = "布尔值-真假"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "is_enabled"
type = "bool"
comment = "布尔值-同boolean"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "birth_date"
type = "date"
comment = "日期-年月日"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "start_time"
type = "time"
comment = "时间-时分秒"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "created_at"
type = "datetime"
comment = "日期时间-完整"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "updated_at"
type = "timestamp"
comment = "时间戳-Unix"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "metadata"
type = "json"
comment = "JSON对象"

[[entities.DATA_TYPE_SHOWCASE.columns]]
name = "settings"
type = "jsonb"
comment = "二进制JSON"
