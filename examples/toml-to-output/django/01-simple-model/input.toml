[config]
namespace = "examples.simple_model"

[entities.USER]
comment = "User entity with basic fields"
table_name = "user"

[[entities.USER.columns]]
name = "id"
type = "int"
primary_key = true
comment = "Primary key"

[[entities.USER.columns]]
name = "username"
type = "string"
