[config]
namespace = "examples.templates_explicit_export"
base_package = "myapp.models"

[templates.AutoDerivedMixin]
package = "base"

[[templates.AutoDerivedMixin.columns]]
name = "id"
type = "uuid"
primary_key = true
comment = "Primary key"

[templates.CustomLocationMixin]
package = "base"

[[templates.CustomLocationMixin.columns]]
name = "status"
type = "string"
comment = "Record status"

[[templates.CustomLocationMixin.columns]]
name = "priority"
type = "int"
comment = "Priority level"

[templates.DirectExportMixin]

[[templates.DirectExportMixin.columns]]
name = "created_at"
type = "datetime"
comment = "Creation timestamp"

[[templates.DirectExportMixin.columns]]
name = "updated_at"
type = "datetime"
comment = "Update timestamp"

[entities.TASK]
extends = ["AutoDerivedMixin", "CustomLocationMixin", "DirectExportMixin"]
comment = "Task entity demonstrating different template path strategies"
table_name = "task"

[[entities.TASK.columns]]
name = "title"
type = "string"
comment = "Task title"

[[entities.TASK.columns]]
name = "description"
type = "text"
comment = "Task description"

[[entities.TASK.columns]]
name = "due_date"
type = "datetime"
nullable = true
comment = "Due date"

[entities.PROJECT]
extends = ["AutoDerivedMixin", "DirectExportMixin"]
comment = "Project entity"
table_name = "project"

[[entities.PROJECT.columns]]
name = "name"
type = "string"
comment = "Project name"

[[entities.PROJECT.columns]]
name = "budget"
type = "decimal"
comment = "Project budget"
