[config]
namespace = "examples.templates_single_file"
base_package = "myapp.models"

[templates.TimestampMixin]
package = "base"

[[templates.TimestampMixin.columns]]
name = "created_at"
type = "datetime"
comment = "Creation timestamp"

[[templates.TimestampMixin.columns]]
name = "updated_at"
type = "datetime"
comment = "Last update timestamp"

[templates.SoftDeleteMixin]
package = "base"

[[templates.SoftDeleteMixin.columns]]
name = "is_deleted"
type = "boolean"
comment = "Soft delete flag"

[[templates.SoftDeleteMixin.columns]]
name = "deleted_at"
type = "datetime"
nullable = true
comment = "Deletion timestamp"

[entities.USER]
extends = ["TimestampMixin", "SoftDeleteMixin"]
comment = "User entity with timestamps and soft delete"
table_name = "user"

[[entities.USER.columns]]
name = "id"
type = "uuid"
primary_key = true
comment = "Primary key"

[[entities.USER.columns]]
name = "username"
type = "string"
unique = true
comment = "Unique username"

[[entities.USER.columns]]
name = "email"
type = "string"
unique = true
comment = "User email address"

[entities.POST]
extends = ["TimestampMixin", "SoftDeleteMixin"]
comment = "Post entity with timestamps and soft delete"
table_name = "post"

[[entities.POST.columns]]
name = "id"
type = "uuid"
primary_key = true
comment = "Primary key"

[[entities.POST.columns]]
name = "author_id"
type = "uuid"
comment = "Foreign key to User"

[[entities.POST.columns]]
name = "title"
type = "string"
comment = "Post title"

[[entities.POST.columns]]
name = "content"
type = "text"
comment = "Post content"

[[relationships]]
left = "USER"
right = "POST"
type = "one-to-many"
right_column = "author_id"
