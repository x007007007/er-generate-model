[config]
namespace = "examples.relationships"

[entities.USER]
comment = "User entity - authors of posts"
table_name = "user"

[[entities.USER.columns]]
name = "id"
type = "uuid"
primary_key = true
comment = "Primary key"

[[entities.USER.columns]]
name = "username"
type = "string"
unique = true
comment = "Unique username"

[[entities.USER.columns]]
name = "email"
type = "string"
unique = true
comment = "User email address"

[[entities.USER.columns]]
name = "age"
type = "int"
comment = "User age"

[[entities.USER.columns]]
name = "is_active"
type = "boolean"
comment = "Whether the user account is active"

[[entities.USER.columns]]
name = "created_at"
type = "datetime"
comment = "Account creation timestamp"

[entities.POST]
comment = "Post entity - blog posts written by users"
table_name = "post"

[[entities.POST.columns]]
name = "id"
type = "uuid"
primary_key = true
comment = "Primary key"

[[entities.POST.columns]]
name = "author_id"
type = "uuid"
comment = "Foreign key to User"

[[entities.POST.columns]]
name = "title"
type = "string"
comment = "Post title"

[[entities.POST.columns]]
name = "content"
type = "text"
comment = "Post content"

[[entities.POST.columns]]
name = "created_at"
type = "datetime"
comment = "Post creation timestamp"

[[relationships]]
left = "USER"
right = "POST"
type = "one-to-many"
right_column = "author_id"
