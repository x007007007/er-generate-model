# Simple User Model Example
# This example demonstrates a basic single-table model with common field types

[entities.USER]
comment = "User entity with basic fields"
columns = [
    {name = "id", type = "int", is_pk = true, comment = "Primary key"},
    {name = "username", type = "string", unique = true, comment = "Unique username"},
    {name = "email", type = "string", comment = "User email address"},
    {name = "created_at", type = "datetime", comment = "Account creation timestamp"},
]
